<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NS-SHAFT 游戏</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" href="./favicon.ico" type="image/x-icon">
</head>

<body>
    <div class="game-wrapper">
        <div class="game-instructions" id="gameInstructions">
            <h3>游戏说明</h3>
            <p>使用 ← → 键（或 A / D）移动</p>
            <p>走到平台边缘自动下落</p>
            <p>按空格键向上跳</p>
            <p>注意不同类型的平台:</p>
            <p>绿色-普通, 紫色-移动, 黄色-破碎, 红色-有刺, 蓝色-弹簧</p>
            <p>屏幕会不断向下滚动，不要掉出屏幕底部！</p>
            <p>碰到顶部尖刺会受伤并从平台上跌落</p>
            <p class="shortcut">P / Esc 暂停 · R 重开 · ` 调试信息</p>
            <button id="closeInstructions" class="close-button">关闭</button>
        </div>

        <div class="game-container">
            <canvas id="gameCanvas"></canvas>
        </div>
    </div>

    <div id="mobileInstructionHint" class="mobile-instruction-hint">
        点击查看游戏说明
    </div>

    <script type="module" src="./src/entries/web.js"></script>
</body>

</html>
